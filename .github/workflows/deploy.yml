name: Despliegue Cloudflare
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  deploy:
    if: vars.DEPLOY_DESDE_GITHUB == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test scripts/pruebas.test.mjs && node scripts/escaneo-privacidad.mjs
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl && npm install --no-save docx@9
      - run: npm run documentos               # Kit de Auditoría (Word) y Tablero (Excel) → web/descargas
      - run: node scripts/empaquetar-web.mjs  # app + motor + datos + lista de descargas
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply centec-planeacion --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
