<style>
/* Layout: tablero de coordinación — barra de pestañas fija arriba, contenido en una columna amplia; resumen antes que detalle */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#15232b; --muted:#5a6b73; --line:#d9e0e3;
  --accent:#0d5f73; --accent-soft:#e1eef1; --chalk:#1d3b33;
  --ok:#1f7a4a; --ok-bg:#e3f3ea; --warn:#a86b00; --warn-bg:#fbf0d9; --bad:#b3362b; --bad-bg:#f9e3e0; --na:#7b878c; --na-bg:#eceff0;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --panel:#162228; --ink:#e3ebee; --muted:#93a4ab; --line:#29383f;
  --accent:#5cb8cc; --accent-soft:#18323a; --chalk:#a8d5c4;
  --ok:#5fcf8f; --ok-bg:#163326; --warn:#f0b54a; --warn-bg:#3a2d12; --bad:#f08072; --bad-bg:#3d1c19; --na:#8e9ba0; --na-bg:#212d32; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --panel:#162228; --ink:#e3ebee; --muted:#93a4ab; --line:#29383f;
  --accent:#5cb8cc; --accent-soft:#18323a; --chalk:#a8d5c4;
  --ok:#5fcf8f; --ok-bg:#163326; --warn:#f0b54a; --warn-bg:#3a2d12; --bad:#f08072; --bad-bg:#3d1c19; --na:#8e9ba0; --na-bg:#212d32; color-scheme:dark}

<script type="module">
// Motor de indicadores CENTEC (compartido por Worker, scripts y app web).
// VERSIONADO: si cambias una fórmula, sube VERSION; el comparativo interanual detecta "serie rota".
const VERSION = '1.0'; // 2027: primera serie

// Pesos del Índice de Cumplimiento Docente (ICD) — basados en evidencia (MET Project, Teach/Banco Mundial,
// EEF). Lo burocrático (puntualidad) pesa poco; la práctica observada y el aprendizaje pesan más.
const PESOS = {
  puntualidad: 0.05,   // C1 planeadores entregados a tiempo (marca de tiempo del servidor)
  ejecucion:   0.10,   // C2 semanas con evidencia fechada / semanas planeadas
  cobertura:   0.10,   // C3 DBA con actividad y evaluación evidenciadas / DBA programados
  planeador:   0.10,   // C4 rúbrica R1 (8 criterios 0–3)
  cuadernos:   0.10,   // C5 rúbrica R2 (5 criterios 0–3) sobre muestra ALEATORIA y ciega
  observacion: 0.20,   // C6 Teach 1–5, ≥2 observadores, kappa válido, normalizado por observador
  aprendizaje: 0.15,   // C7 ganancia de Hake con contracción bayesiana (grupos pequeños)
  inclusion:   0.10,   // C8 ajustes PIAR evidenciados / comprometidos (Decreto 1421/2017)
  transversal: 0.05,   // C9 proyectos transversales con producto y evidencia fechada
  estudiantes: 0.05,   // C10 encuesta estudiantil anónima (7Cs adaptada), n ≥ 10
};
const SEMAFORO = [
  { min: 85, nivel: 'Verde — cumple con excelencia', color: 'verde', accion: 'Reconocimiento y rol de mentor par' },
  { min: 70, nivel: 'Amarillo — cumple parcialmente', color: 'amarillo', accion: 'Plan de mejora con 2 metas observables; re-medición en 6 semanas' },
  { min: 0,  nivel: 'Rojo — no cumple', color: 'rojo', accion: 'Plan intensivo; observación cada 2 semanas' },
];
const G_MEDIA_COLEGIO_DEFECTO = 0.30;
const K_CONTRACCION = 10;
const UMBRAL_TRIANGULACION = 25;
const MIN_FUENTES = 3;   // nunca se califica a un docente con menos de 3 fuentes independientes
const KAPPA_MIN = 0.60;

const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const e5 = en => (en[0].escala || 5);
const pct = (n, d) => d > 0 ? Math.max(0, Math.min(100, 100 * n / d)) : null;
const escala = (v, min, max) => v == null ? null : 100 * (v - min) / (max - min); // 1–4 o 1–5 → 0–100

// Ganancia normalizada de Hake (0–1); se lleva a 0–100 con 0.7 = 100 (ganancia "alta").
function hake(pre, post) {
  if (pre == null || post == null || pre >= 100) return null;
  return (post - pre) / (100 - pre);
}
// Kappa de Cohen para dos observadores sobre las mismas categorías (enteros).
function kappa(a, b) {
  if (!a || !b || a.length !== b.length || !a.length) return null;
  const cats = [...new Set([...a, ...b])];
  const n = a.length;
  const po = a.filter((x, i) => x === b[i]).length / n;
  const pe = cats.reduce((s, c) => s + (a.filter(x => x === c).length / n) * (b.filter(x => x === c).length / n), 0);
  return pe === 1 ? 1 : (po - pe) / (1 - pe);
}
// Kappa ponderado lineal (más justo para escalas ordinales 1–4)
function kappaPonderado(a, b, k = 4) {
  if (!a || !b || a.length !== b.length || !a.length) return null;
  const n = a.length, w = (i, j) => 1 - Math.abs(i - j) / (k - 1);
  let po = 0; for (let i = 0; i < n; i++) po += w(a[i], b[i]); po /= n;
  let pe = 0;
  for (let i = 1; i <= k; i++) for (let j = 1; j <= k; j++)
    pe += w(i, j) * (a.filter(x => x === i).length / n) * (b.filter(x => x === j).length / n);
  return pe === 1 ? 1 : (po - pe) / (1 - pe);
}
// Sorteo reproducible (mulberry32) para muestreo de cuadernos
function sortear(semillaTexto, total, k) {
  let h = 1779033703 ^ semillaTexto.length;
  for (let i = 0; i < semillaTexto.length; i++) { h = Math.imul(h ^ semillaTexto.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  let s = h >>> 0;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pool = Array.from({ length: total }, (_, i) => i + 1);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, Math.min(k, total)).sort((a, b) => a - b);
}
function tamanoMuestra(n) { return Math.max(5, Math.ceil(n * 0.2)); }

// Normalización por observador: corrige indulgencia/severidad sistemática.
function sesgoObservadores(regs) {
  const porObs = {};
  for (const r of regs.filter(r => r.tipo === 'observacion')) {
    for (const o of [r.payload.obs1, r.payload.obs2].filter(Boolean)) {
      (porObs[o.observador] ||= []).push(avg(o.puntajes));
    }
  }
  const global = avg(Object.values(porObs).flat());
  const ajuste = {};
  for (const [k, v] of Object.entries(porObs)) ajuste[k] = v.length >= 3 ? avg(v) - global : 0;
  return ajuste;
}

// Calcula los 9 componentes + ICD para un docente en un período (o año si periodo=null)
function calcularDocente(regs, docente, periodo = null) {
  const R = regs.filter(r => r.docente === docente && (periodo == null || r.periodo === periodo));
  const por = t => R.filter(r => r.tipo === t).map(r => r.payload);
  const ajusteObs = sesgoObservadores(regs);
  const c = {};
  const pl = por('planeador');
  c.puntualidad = pl.length ? pct(pl.filter(p => p.a_tiempo).length, pl.length) : null;
  c.planeador = pl.length ? escala(avg(pl.map(p => avg(p.rubrica || []))), 0, 3) : null;
  const dbaT = pl.reduce((s, p) => s + (p.dba_total || 0), 0);
  c.cobertura = dbaT ? pct(pl.reduce((s, p) => s + (p.dba_cubiertos || 0), 0), dbaT) : null;
  const ej = por('ejecucion');
  c.ejecucion = ej.length ? pct(ej.reduce((s, e) => s + e.semanas_ejecutadas, 0), ej.reduce((s, e) => s + e.semanas_planeadas, 0)) : null;
  const cu = por('cuaderno');
  c.cuadernos = cu.length ? escala(avg(cu.flatMap(x => x.puntajes || [])), 0, 3) : null;
  const ob = por('observacion');
  const kappas = [];
  const vals = [];
  for (const o of ob) {
    const ps = [o.obs1, o.obs2].filter(Boolean);
    if (o.obs1 && o.obs2) {
      const k = kappaPonderado(o.obs1.puntajes, o.obs2.puntajes, 5);
      kappas.push(k);
      if (k < KAPPA_MIN) continue; // observación no fiable: no cuenta
    }
    vals.push(avg(ps.map(x => avg(x.puntajes) - (ajusteObs[x.observador] || 0))));
  }
  c.observacion = vals.length ? Math.max(0, Math.min(100, escala(avg(vals), 1, 5))) : null;
  const observadores = new Set(ob.flatMap(o => [o.obs1, o.obs2].filter(Boolean).map(x => x.observador)));
  // Ganancia: promedio por estudiante (excluye pre > 90, efecto techo) + contracción hacia la media del colegio
  const res = por('resultado');
  const gs = res.flatMap(r => (r.estudiantes || [{ pre: r.pre, post: r.post }]).filter(e => e.pre <= 90).map(e => hake(e.pre, e.post))).filter(x => x != null);
  if (gs.length) {
    const n = gs.length, gm = (regs.gMediaColegio ?? G_MEDIA_COLEGIO_DEFECTO);
    const gAj = (n / (n + K_CONTRACCION)) * avg(gs) + (K_CONTRACCION / (n + K_CONTRACCION)) * gm;
    c.aprendizaje = Math.max(0, Math.min(100, 100 * (gAj - 0.10) / 0.40)); // g ≤ 0,10 → 0 ; g ≥ 0,50 → 100
  } else c.aprendizaje = null;
  const pi = por('piar');
  c.inclusion = pi.length ? pct(pi.reduce((s, p) => s + p.ajustes_evidenciados, 0), pi.reduce((s, p) => s + p.ajustes_planeados, 0)) : null;
  const tr = por('transversal');
  c.transversal = tr.length ? pct(tr.reduce((s, t) => s + t.fases_evidenciadas, 0), tr.length * 5) : null;

  const en = por('encuesta').filter(e => (e.n || 0) >= 10);
  c.estudiantes = en.length ? escala(avg(en.map(e => e.promedio)), 1, e5(en)) : null;

  const disponibles = Object.entries(c).filter(([, v]) => v != null);
  const fuentes = new Set(R.map(r => r.tipo)).size;
  let icd = null;
  if (fuentes >= MIN_FUENTES && disponibles.length) {
    const w = disponibles.reduce((s, [k]) => s + PESOS[k], 0);
    icd = disponibles.reduce((s, [k, v]) => s + PESOS[k] * v, 0) / w; // re-pondera sin inventar ceros
  }
  // Reglas de bloqueo: lo administrativo no compensa lo esencial
  const reglas = [];
  let tope = 100;
  if (c.ejecucion != null && c.ejecucion < 60) { tope = Math.min(tope, 69.9); reglas.push('Ejecución < 60 %: rojo automático (la planeación no se está ejecutando)'); }
  if (c.inclusion != null && c.inclusion < 80) { tope = Math.min(tope, 84.9); reglas.push('PIAR < 80 %: máximo amarillo'); }
  if (c.observacion != null && c.observacion < 50 && observadores.size >= 2) { tope = Math.min(tope, 84.9); reglas.push('Observación < 50 con 2 observadores: máximo amarillo'); }
  if (icd != null) icd = Math.min(icd, tope);
  // Ningún rojo con observaciones no fiables
  const kappaBaja = kappas.some(k => k < KAPPA_MIN);
  if (icd != null && icd < 70 && kappaBaja && reglas.length === 0) reglas.push('Rojo suspendido: repetir observación (kappa < 0,60)');
  // Triangulación: fuentes que difieren > 25 puntos → revisión antes de asignar color
  const tri = ['observacion', 'cuadernos', 'aprendizaje', 'estudiantes'].map(k => c[k]).filter(v => v != null);
  const discrepancia = tri.length >= 2 && (Math.max(...tri) - Math.min(...tri)) > UMBRAL_TRIANGULACION;
  if (discrepancia) reglas.push('Fuentes difieren > 25 puntos: tercera observación sin aviso y nueva revisión de cuadernos antes del color definitivo');
  const sem = icd == null ? { nivel: 'Sin datos suficientes (< 3 fuentes)', color: 'gris' }
            : (kappaBaja && icd < 70 && !reglas.some(r => r.startsWith('Ejecución'))) ? { nivel: 'Pendiente — repetir observación', color: 'gris' }
            : SEMAFORO.find(s => icd >= s.min);
  return {
    docente, periodo, componentes: c, icd: icd == null ? null : Math.round(icd * 10) / 10,
    semaforo: sem, fuentes, cobertura_pesos: Math.round(100 * disponibles.reduce((s, [k]) => s + PESOS[k], 0)),
    kappa_promedio: kappas.length ? Math.round(avg(kappas) * 100) / 100 : null,
    observaciones_descartadas: kappas.filter(k => k < KAPPA_MIN).length,
    observadores: observadores.size, reglas, discrepancia,
  };
}
function calcularTodo(regs, periodo = null) {
  const docentes = [...new Set(regs.map(r => r.docente))].sort();
  const filas = docentes.map(d => calcularDocente(regs, d, periodo));
  const icds = filas.map(f => f.icd).filter(x => x != null);
  return { version: VERSION, periodo, filas, institucional: icds.length ? Math.round(avg(icds) * 10) / 10 : null };
}
// Alertas automáticas (las usa el cron diario)
function alertas(regs, anio, hoy = new Date()) {
  const out = [];
  for (const f of calcularTodo(regs).filas) {
    if (f.icd != null && f.icd < 70) out.push({ nivel: 'alta', docente: f.docente, msg: `ICD ${f.icd} (Rojo): plan de mejora intensivo` });
    if (f.fuentes < MIN_FUENTES) out.push({ nivel: 'media', docente: f.docente, msg: `Solo ${f.fuentes} fuentes de evidencia; faltan registros` });
    if (f.observaciones_descartadas) out.push({ nivel: 'media', docente: f.docente, msg: `${f.observaciones_descartadas} observación(es) con kappa < ${KAPPA_MIN}: repetir con calibración` });
    if (f.componentes.inclusion != null && f.componentes.inclusion < 90) out.push({ nivel: 'alta', docente: f.docente, msg: `Ajustes PIAR evidenciados ${Math.round(f.componentes.inclusion)} % (< 90 %)` });
    if (f.discrepancia) out.push({ nivel: 'media', docente: f.docente, msg: 'Discrepancia > 25 puntos entre fuentes: triangular' });
    if (f.observadores < 2 && f.componentes.observacion != null) out.push({ nivel: 'baja', docente: f.docente, msg: 'Falta observación por un segundo observador' });
  }
  return out;
}

const AREAS = ['Integrada', 'Matemáticas', 'Lenguaje', 'Ciencias Naturales', 'Ciencias Sociales', 'Inglés', 'Tecnología e Informática', 'Ética y Religión', 'Artística', 'Educación Física', 'Física', 'Química', 'Filosofía', 'Ciencias Económicas y Políticas'];
function demo(anio, mejora) {
  const r = []; let seed = anio * 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const docentes = ['Docente A (Transición)', 'Docente B (1°)', 'Docente C (3°)', 'Docente D (5°)', 'Docente E (Inglés primaria)', 'Docente F (Matemáticas 6°–9°)', 'Docente G (Lenguaje 6°–11°)', 'Docente H (Ciencias 6°–11°)'];
  const perfil = [0.9, 0.75, 0.6, 0.85, 0.7, 0.45, 0.8, 0.65].map(p => Math.min(0.97, p + mejora));
  docentes.forEach((d, i) => {
    const p = perfil[i], g = GRADOS[[0, 1, 3, 5, 5, 7, 9, 8][i]];
    for (let per = 1; per <= 4; per++) {
      const j = () => (rnd() - 0.5) * 0.2;
      r.push({ id: `${anio}-${i}-${per}-pl`, anio, periodo: per, tipo: 'planeador', docente: d, grado: g, payload: { a_tiempo: rnd() < p + 0.1, rubrica: Array.from({ length: 8 }, () => Math.max(0, Math.min(3, Math.round(3 * (p + j()))))), dba_total: 6, dba_cubiertos: Math.min(6, Math.round(6 * (p + 0.1 + j()))) } });
      r.push({ id: `${anio}-${i}-${per}-ej`, anio, periodo: per, tipo: 'ejecucion', docente: d, grado: g, payload: { semanas_planeadas: 10, semanas_ejecutadas: Math.min(10, Math.round(10 * (p + 0.15 + j()))) } });
      r.push({ id: `${anio}-${i}-${per}-cu`, anio, periodo: per, tipo: 'cuaderno', docente: d, grado: g, payload: { semilla: `${anio}-${per}|${g}`, muestra: I.sortear(`${anio}-${per}|${g}`, 28, 5), puntajes: Array.from({ length: 5 }, () => Math.max(0, Math.min(3, Math.round(3 * (p + j()))))) } });
      const base = 1 + 4 * p;
      const o1 = Array.from({ length: 9 }, () => Math.max(1, Math.min(5, Math.round(base + (rnd() - 0.5) * 1.2))));
      const o2 = per % 2 ? o1.map(x => Math.max(1, Math.min(5, x + (rnd() < 0.25 ? (rnd() < 0.5 ? 1 : -1) : 0)))) : null;
      r.push({ id: `${anio}-${i}-${per}-ob`, anio, periodo: per, tipo: 'observacion', docente: d, grado: g, payload: { obs1: { observador: per % 2 ? 'Coordinación académica' : 'Rectoría', puntajes: o1 }, obs2: o2 && { observador: 'Vicerrectoría', puntajes: o2 }, tiempo_aprendizaje: Math.round(60 + 35 * p) } });
      r.push({ id: `${anio}-${i}-${per}-re`, anio, periodo: per, tipo: 'resultado', docente: d, grado: g, payload: { estudiantes: Array.from({ length: 24 }, () => { const pre = 25 + rnd() * 40; return { pre: Math.round(pre), post: Math.round(Math.min(100, pre + (100 - pre) * (0.1 + 0.45 * p + j()))) }; }) } });
      if (i % 3 === 0) r.push({ id: `${anio}-${i}-${per}-pi`, anio, periodo: per, tipo: 'piar', docente: d, grado: g, payload: { codigo: `P-${anio}-${String(i).padStart(2, '0')}-0${per}`, ajustes_planeados: 6, ajustes_evidenciados: Math.min(6, Math.round(6 * (p + 0.05))) } });
      r.push({ id: `${anio}-${i}-${per}-tr`, anio, periodo: per, tipo: 'transversal', docente: d, grado: g, payload: { proyecto: ['PRAE', 'DEMOCRACIA', 'PESCC', 'FINANCIERA'][per - 1], fases_evidenciadas: Math.min(5, Math.round(5 * (p + 0.1))) } });
      if (per === 2 || per === 4) r.push({ id: `${anio}-${i}-${per}-en`, anio, periodo: per, tipo: 'encuesta', docente: d, grado: g, payload: { n: 22, escala: 5, promedio: Math.min(5, 2.6 + 2.2 * p) } });
    }
  });
  return r;
}

async function detectarApi() {
  try { const r = await fetch('/api/health', { cache: 'no-store' }); if (!r.ok) return false; const j = await r.json(); return !!j.ok; } catch (e) { return false; }
}
async function cargarAnio(anio) {
  if (st.api) {
    const r = await fetch(`/api/registros?anio=${anio}`); st.regs[anio] = r.ok ? await r.json() : [];
  }
  st.regs[anio] ||= [];
}
async function enviar(reg) {
  if (st.cerrados.includes(reg.anio)) { toast(`El año ${reg.anio} está cerrado: solo lectura`); return false; }
  if (st.api) {
    const r = await fetch('/api/registros', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(reg) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { toast(j.error || 'No se pudo guardar'); return false; }
  }
  st.regs[reg.anio].push({ ...reg, id: reg.id || crypto.randomUUID(), creado: new Date().toISOString() });
  guardar(); return true;
}

    ejecucion: `<div class="row"><label>Semanas planeadas en el período<input id="e-pl" type="number" min="1" value="10"></label><label>Semanas con evidencia fechada que coincide<input id="e-ej" type="number" min="0" value="9"></label></div>`,
    cuaderno: `<div class="card" style="background:var(--accent-soft)"><h3>Sorteo auditable de cuadernos</h3><div class="row"><label>Estudiantes en lista<input id="c-n" type="number" min="1" value="28"></label><label>Semilla (fecha|grado|área)<input id="c-seed" value="${new Date().toISOString().slice(0, 10)}|"></label></div><button type="button" class="ghost" id="c-sortear">Sortear números de lista</button><p class="mono" id="c-res">Muestra: —</p><p class="small muted">Cualquier auditor puede reproducir el sorteo con la misma semilla. La revisión la hace un coordinador de otra área, con el nombre del docente tapado.</p></div>
      <h3>Rúbrica R2 · promedio de la muestra (0–3)</h3>${RUBRICAS.cuaderno.map((c, i) => `<div class="crit"><span>${c}</span>${seg('r2-' + i, 3)}</div>`).join('')}`,
    observacion: `<p class="small muted">Instrumento Teach (Banco Mundial), 9 elementos de 1 a 5. Dos observadores califican por separado sin hablar; si κ ponderado &lt; 0,60 la observación no cuenta y se repite.</p>

function leerSeg(prefix, n) { return Array.from({ length: n }, (_, i) => { const e = document.querySelector(`input[name="${prefix}${i}"]:checked`); return e ? Number(e.value) : null; }); }
function parseRes(t) { return t.split(/\n+/).map(l => l.split(/[;,\t ]+/).map(Number)).filter(a => a.length >= 2 && a.every(Number.isFinite)).map(([pre, post]) => ({ pre, post })); }

async function onSubmitReg(e) {
  e.preventDefault();
  const tipo = st.tipoReg || 'planeador';
  const base = { anio: st.anio, periodo: Number($('#r-per').value), tipo, docente: esDir() ? $('#r-doc').value.trim() : st.yo.nombre, grado: $('#r-grado').value, area: $('#r-area').value, semana: Number($('#r-sem').value), evidencia_url: $('#r-url').value || null };
  let payload;
  if (tipo === 'planeador') payload = { a_tiempo: $('#p-tiempo').value === '1', dba_total: +$('#p-dbat').value, dba_cubiertos: +$('#p-dbac').value, rubrica: leerSeg('r1-', 8) };
  if (tipo === 'ejecucion') payload = { semanas_planeadas: +$('#e-pl').value, semanas_ejecutadas: +$('#e-ej').value };
  if (tipo === 'cuaderno') payload = { semilla: $('#c-seed').value, muestra: st.muestra || [], puntajes: leerSeg('r2-', 5).filter(x => x != null) };
  if (tipo === 'observacion') {
    const a = leerSeg('t1-', 9), b = leerSeg('t2-', 9);
    payload = { con_aviso: $('#o-aviso').value === '1', obs1: { observador: $('#o-1').value, puntajes: a }, obs2: $('#o-2').value && b.every(x => x != null) ? { observador: $('#o-2').value, puntajes: b } : null };
    if (payload.obs2) { const k = I.kappaPonderado(a, b, 5); toast(`κ ponderado = ${k.toFixed(2)} ${k < I.KAPPA_MIN ? '· no cuenta, repetir' : '· válida'}`); }
  }
  if (tipo === 'resultado') { const est = parseRes($('#res-txt').value); if (!est.length) { toast('Pegue al menos un par pre;post'); return; } payload = { estudiantes: est }; }
  if (tipo === 'piar') payload = { codigo: $('#pi-cod').value.toUpperCase(), ajustes_planeados: +$('#pi-pl').value, ajustes_evidenciados: +$('#pi-ev').value };
  if (tipo === 'transversal') payload = { proyecto: $('#tr-p').value, fases_evidenciadas: +$('#tr-f').value };
  if (tipo === 'encuesta') { const n = +$('#en-n').value; if (n < 10) toast('Menos de 10 respuestas: se guarda pero no cuenta en el índice'); payload = { n, escala: +$('#en-esc').value, promedio: +$('#en-p').value }; }
  if (await enviar({ ...base, payload })) { toast('Registro guardado'); st.muestra = null; render(); }
}

function vComparar() {
  const filas = st.anios.map(a => ({ a, r: I.calcularTodo(st.regs[a] || []) })).filter(x => x.r.filas.length);
  const comps = Object.keys(I.PESOS);
  const prom = (r, k) => { const v = r.filas.map(f => f.componentes[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b) / v.length : null; };
  const lines = [['ICD institucional', r => r.institucional], ...comps.map(k => [NOMBRES[k] || k, r => prom(r, k)])];
  const W = 640, H = 220, bw = Math.min(70, (W - 80) / Math.max(1, filas.length) - 20);
  const y = v => H - 30 - (v ?? 0) * (H - 60) / 100;
  return `${bannerDemo()}<section class="card"><h1>Año vs año</h1><p class="small muted">Mismos indicadores, misma fórmula (v${I.VERSION}). Una diferencia de 5 puntos o más se considera cambio real; menos, estable. Cada cierre anual congela el año y lo agrega aquí automáticamente.</p>
  ${filas.length < 2 ? '<p class="banner">Se necesitan al menos dos años con datos. El primer comparativo real aparecerá al cerrar 2027 y registrar 2028.</p>' : ''}
  <div class="tbl"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="ICD institucional por año">
   ${[0, 70, 85, 100].map(v => `<line x1="40" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="6" y="${y(v) + 4}">${v}</text>`).join('')}
   ${filas.map((x, i) => { const v = x.r.institucional, cx = 70 + i * ((W - 80) / filas.length); return `<rect x="${cx}" y="${y(v)}" width="${bw}" height="${H - 30 - y(v)}" rx="3" fill="var(--accent)"/><text x="${cx}" y="${H - 10}">${x.a}</text><text x="${cx}" y="${y(v) - 6}" style="fill:var(--ink)">${f1(v)}</text>`; }).join('')}
  </svg></div>
  <div class="tbl"><table><thead><tr><th>Indicador</th>${filas.map(x => `<th>${x.a}</th>`).join('')}<th>Δ último año</th><th>Tendencia</th></tr></thead><tbody>
  ${lines.map(([n, fn]) => { const v = filas.map(x => fn(x.r)); const d = v.length > 1 && v.at(-1) != null && v.at(-2) != null ? v.at(-1) - v.at(-2) : null; const t = d == null ? '<span class="pill gris">—</span>' : d >= 5 ? '<span class="pill verde">mejora</span>' : d <= -5 ? '<span class="pill rojo">retroceso</span>' : '<span class="pill gris">estable</span>'; return `<tr><td>${esc(n)}</td>${v.map(x => `<td class="n">${f1(x)}</td>`).join('')}<td class="n">${d == null ? '—' : (d > 0 ? '+' : '') + f1(d)}</td><td>${t}</td></tr>`; }).join('')}
  </tbody></table></div></section>
  <section class="card"><h2>Docentes: comparación individual</h2><div class="tbl"><table><thead><tr><th>Docente</th>${filas.map(x => `<th>${x.a}</th>`).join('')}</tr></thead><tbody>
  ${[...new Set(filas.flatMap(x => x.r.filas.map(f => f.docente)))].sort().map(d => `<tr><td>${esc(d)}</td>${filas.map(x => { const f = x.r.filas.find(z => z.docente === d); return `<td>${f ? `<span class="mono">${f1(f.icd)}</span> ${pill(f.semaforo)}` : '—'}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table></div></section>`;
}

function vNormativa() {

  const hoy = Date.now();
  return `<section class="card"><h1>Registro normativo</h1><p class="small muted">Lo mantiene el agente investigador-normativo: revisión automática el día 1 de cada mes y verificación completa cada octubre. Cada cambio con impacto llega como propuesta para aprobación de coordinación. Última actualización del registro: <span class="mono">${esc(n.actualizado || '—')}</span>.</p>
  <div class="tbl"><table><thead><tr><th>Norma</th><th>Tema</th><th>Qué obliga en la planeación</th><th>Evidencia que pide un auditor</th><th>Verificada</th></tr></thead><tbody>
  ${n.normas.map(x => { const dias = (hoy - Date.parse(x.ultima_verificacion)) / 864e5; return `<tr><td><b>${esc(x.norma)}</b><br>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">fuente oficial</a>` : ''} ${x.estado && x.estado !== 'vigente' ? `<span class="chip">${esc(x.estado)}</span>` : ''}</td><td>${esc(x.tema)}</td><td>${esc(x.obliga)}</td><td>${esc(x.evidencia)}</td><td class="mono small">${esc(x.ultima_verificacion)}${dias > 365 ? ' <span class="pill rojo">revisar</span>' : ''}</td></tr>`; }).join('')}
  </tbody></table></div></section>
  ${n.novedades?.length ? `<section class="card"><h2>Novedades y pendientes de verificación</h2><ul>${n.novedades.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>` : ''}`;
}

function vDocumentos() {
  const d = DATOS.descargas || [];
  return `<section class="card"><h1>Documentos para descargar</h1>
  <p class="small muted">Se regeneran solos con cada actualización del sistema: si cambia una norma, un indicador o un formato, el siguiente despliegue publica la versión nueva aquí. Siempre descargue desde esta página para tener la última versión.</p>
  ${st.api ? '' : '<div class="banner">En esta vista previa las descargas están bloqueadas por el navegador. Funcionan en el aplicativo publicado en Cloudflare; mientras tanto use los archivos enviados en el chat.</div>'}
  <div class="grid">${d.map(x => `<div class="card" style="gap:8px"><span class="chip" style="justify-self:start">${esc(x.tipo)}</span><h3>${esc(x.titulo)}</h3><p class="small">${esc(x.desc)}</p><p class="small muted mono">${esc(x.archivo)} · ${x.kb} KB · ${esc(x.fecha)}</p><a class="btn" href="descargas/${encodeURIComponent(x.archivo)}" download>Descargar ${esc(x.tipo)}</a></div>`).join('') || '<p class="muted">No hay documentos generados todavía.</p>'}</div></section>`;
}

function vSugerir() {
  return `<section class="card"><h1>Sugerir una mejora</h1><p class="small muted">Cada sugerencia llega al equipo de mejora continua y, si se aprueba, se convierte en un cambio del aplicativo. No incluya datos de estudiantes.</p>
  <form id="fsug" class="reg"><textarea id="sug-txt" required minlength="10" placeholder="Ej.: que el planeador se pueda duplicar de la semana anterior"></textarea><div class="row"><button type="submit">Enviar sugerencia</button></div></form></section>`;
}

function vUsuarios() {
  const u = st.usuarios || [];
  const ed = st.uEdit || { email: '', nombre: '', cargo: 'Docente', asignaciones: [], activo: 1 };
  const tiene = (g, a) => ed.asignaciones.some(x => x.grado === g && x.area === a);
  return `<section class="card"><h1>Usuarios y permisos</h1>
  <p class="small">Acceso total: ${DIRECTIVOS_DEMO.map(esc).join(', ')}. ${st.api ? 'Se configuran con el secreto ADMINS del servidor, no desde esta pantalla, para que nadie pueda darse permisos a sí mismo.' : ''}</p>
  <p class="small muted">Cada docente entra con su correo institucional y solo ve y registra lo de sus grados y áreas. No ve el tablero de otros docentes, la comparación institucional, los usuarios ni la configuración.</p>
  <div class="tbl"><table><thead><tr><th>Docente</th><th>Correo</th><th>Grados y áreas</th><th>Estado</th><th></th></tr></thead><tbody>
  ${u.map((x, i) => `<tr><td>${esc(x.nombre)}</td><td class="small mono">${esc(x.email)}</td><td class="small">${esc(x.asignaciones.map(a => a.grado + ' ' + (a.area === '*' ? '(todas)' : a.area)).join(' · '))}</td><td>${x.activo ? '<span class="pill verde">activo</span>' : '<span class="pill gris">inactivo</span>'}</td><td><button class="ghost" data-uedit="${i}">Editar</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Aún no hay docentes registrados.</td></tr>'}
  </tbody></table></div></section>
  <section class="card"><h2>${ed.email ? 'Editar docente' : 'Agregar docente'}</h2>
  <form id="fusr" class="reg"><div class="row"><label>Nombre completo (igual al de sus registros)<input id="u-nom" required value="${esc(ed.nombre)}"></label><label>Correo institucional<input id="u-mail" type="email" required value="${esc(ed.email)}" ${ed.email ? 'readonly' : ''}></label><label>Estado<select id="u-act"><option value="1" ${ed.activo ? 'selected' : ''}>Activo</option><option value="0" ${ed.activo ? '' : 'selected'}>Inactivo (sin acceso)</option></select></label></div>
  <h3>Grados y áreas asignados</h3><p class="small muted">Marque «Todas» para docentes de grado (primaria integrada).</p>
  <div class="tbl"><table><thead><tr><th>Grado</th><th>Todas</th>${AREAS.map(a => `<th style="white-space:normal;min-width:70px">${esc(a)}</th>`).join('')}</tr></thead><tbody>
  ${GRADOS.map(g => `<tr><td><b>${g}</b></td><td><input type="checkbox" data-g="${g}" data-a="*" ${tiene(g, '*') ? 'checked' : ''} aria-label="${g} todas"></td>${AREAS.map(a => `<td><input type="checkbox" data-g="${g}" data-a="${esc(a)}" ${tiene(g, a) ? 'checked' : ''} aria-label="${g} ${esc(a)}"></td>`).join('')}</tr>`).join('')}
  </tbody></table></div>
  <div class="row"><button type="submit">Guardar docente</button>${ed.email ? '<button type="button" class="ghost" id="u-nuevo">Agregar otro</button>' : ''}</div></form></section>`;
}

function vAgentes() {
  const ag = DATOS.agentes || [];
  const cal = DATOS.calendario?.ciclos || [];
  return `<section class="card"><h1>Equipo de agentes</h1><p class="small muted">Cada agente es un especialista con instrucciones propias en el repositorio (.claude/agents). El orquestador los coordina; ningún cambio se aplica sin aprobación humana.</p>
  <div class="grid">${ag.map(a => `<div class="agent"><b>${esc(a.nombre)}</b><span class="small">${esc(a.rol)}</span><span class="small muted">${esc(a.cuando)}</span></div>`).join('')}</div></section>
  <section class="card"><h2>Qué se revisa, cuándo y quién</h2><div class="tbl"><table><thead><tr><th>Cuándo</th><th>Qué</th><th>Quién</th><th>Modo</th></tr></thead><tbody>
  ${cal.map(c => `<tr><td class="small">${esc(c.cuando)}</td><td>${esc(c.que)}${c.skill ? ` <span class="chip">${esc(c.skill)}</span>` : ''}</td><td class="small">${esc(c.quien)}</td><td>${c.auto ? '<span class="pill verde">automático</span>' : '<span class="pill gris">humano + app</span>'}</td></tr>`).join('')}
  </tbody></table></div></section>
  <section class="card" id="sugerir"><h2>Sugerir una mejora al aplicativo</h2>
  <p class="small muted">Cada sugerencia se convierte en una tarea para el agente de mejora continua, que la implementa, la prueba y la propone para aprobación. Describa qué le hace perder tiempo o qué le falta. No incluya datos de estudiantes.</p>
  <form id="fsug" class="reg"><textarea id="sug-txt" required minlength="10" placeholder="Ej.: que el planeador se pueda duplicar de la semana anterior"></textarea><div class="row"><button type="submit">Enviar sugerencia</button></div></form>
  ${(st.sugerencias || []).length ? `<p class="small muted">Enviadas desde este navegador: ${st.sugerencias.length}</p>` : ''}</section>
  <section class="card"><h2>Reglas que evitan el sesgo</h2><ul>${(DATOS.indicadores?.reglas_bloqueo || []).map(r => `<li>${esc(r)}</li>`).join('')}<li>Cuadernos sorteados con semilla registrada y revisados a ciegas por un coordinador de otra área.</li><li>Puntajes de observación corregidos por la indulgencia o severidad sistemática de cada observador.</li><li>Ganancia de aprendizaje con contracción hacia la media del colegio, para que un grupo pequeño no premie ni castigue por azar.</li><li>Evidencias con marca de tiempo del servidor y huella SHA-256: no se pueden editar después.</li></ul></section>`;
}

function vDatos() {
  return `${bannerDemo()}<section class="two">
  <div class="card"><h2>Años de planeación</h2><div class="tbl"><table><thead><tr><th>Año</th><th>Registros</th><th>Estado</th><th></th></tr></thead><tbody>
  ${st.anios.map(a => `<tr><td class="mono">${a}</td><td class="n">${(st.regs[a] || []).length}</td><td>${st.cerrados.includes(a) ? '<span class="pill gris">cerrado</span>' : '<span class="pill verde">abierto</span>'}</td><td>${st.cerrados.includes(a) ? '' : `<button class="ghost" data-cerrar="${a}">Cerrar año</button>`}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="row"><button id="nuevoAnio">Abrir año ${Math.max(...st.anios) + 1}</button></div>
  <div id="confirmar"></div>
  <p class="small muted">Cerrar un año lo congela (solo lectura) y lo vuelve línea base del siguiente. El cierre automático corre el 1 de diciembre; la apertura del año siguiente, el 15 de octubre.</p></div>
  <div class="card"><h2>Exportar e importar</h2><p class="small">El JSON exportado es el insumo de los agentes de auditoría y del comparativo interanual en GitHub.</p>
  <div class="row"><button id="exp" class="ghost">Copiar JSON del año ${st.anio}</button><label class="small muted" style="display:grid;gap:4px">Importar JSON<input type="file" id="imp" accept="application/json"></label></div>
  <textarea id="expTxt" hidden readonly></textarea>
  ${st.demo ? `<button id="borrarDemo" class="ghost">Borrar datos de ejemplo y empezar con datos reales</button>` : ''}</div></section>`;
}

function render() {
  if (st.sinAcceso) { $('#tabs').innerHTML = ''; $('#main').innerHTML = `<section class="card"><h1>Sin acceso</h1><p>${esc(st.sinAcceso)}</p></section>`; return; }
  const vc = $('#verComo');
  if (!st.api) { $('#verComoL').hidden = false; vc.innerHTML = `<option value="">Directivo (acceso total)</option>` + st.usuarios.map((u, i) => `<option value="${i}" ${st.yo?.email === u.email ? 'selected' : ''}>${esc(u.nombre)}</option>`).join(''); }
  pintarTabs();
  $('#selAnio').innerHTML = st.anios.map(a => `<option ${a === st.anio ? 'selected' : ''}>${a}</option>`).join('');
  $('#selPer').value = st.periodo;
  const v = { tablero: vTablero, registrar: vRegistrar, comparar: vComparar, normativa: vNormativa, documentos: vDocumentos, usuarios: vUsuarios, sugerir: vSugerir, agentes: vAgentes, datos: vDatos }[st.tab];
  $('#main').innerHTML = v();
  wire();
}
function wire() {
  document.querySelectorAll('[data-doc]').forEach(el => { const go = () => { st.docSel = el.dataset.doc; render(); }; el.onclick = go; el.onkeydown = e => { if (e.key === 'Enter') go(); }; });
  const vb = $('#volver'); if (vb) vb.onclick = () => { st.docSel = null; render(); };
  document.querySelectorAll('[data-tipo]').forEach(b => b.onclick = () => { st.tipoReg = b.dataset.tipo; render(); });
  const fr = $('#freg'); if (fr) fr.onsubmit = onSubmitReg;
  const rg = $('#r-grado'); if (rg && st._areasDe) rg.onchange = () => { $('#r-area').innerHTML = st._areasDe(rg.value).map(a => `<option>${a}</option>`).join(''); };
  const cs = $('#c-sortear'); if (cs) cs.onclick = () => { const seed = $('#c-seed').value + '|' + $('#r-grado').value + '|' + $('#r-area').value; const n = +$('#c-n').value; st.muestra = I.sortear(seed, n, I.tamanoMuestra(n)); $('#c-seed').value = seed; $('#c-res').textContent = 'Muestra (números de lista): ' + st.muestra.join(', '); };
  const rt = $('#res-txt'); if (rt) rt.oninput = () => { const g = parseRes(rt.value).filter(e => e.pre <= 90).map(e => I.hake(e.pre, e.post)).filter(x => x != null); $('#res-g').textContent = g.length ? `g promedio: ${(g.reduce((a, b) => a + b) / g.length).toFixed(2)} (${g.length} estudiantes)` : 'g promedio: —'; };
  const na = $('#nuevoAnio'); if (na) na.onclick = async () => { const a = Math.max(...st.anios) + 1; if (st.api) await fetch('/api/anios', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ anio: a }) }); st.anios.push(a); st.regs[a] = []; guardar(); toast(`Año ${a} abierto`); render(); };
  document.querySelectorAll('[data-cerrar]').forEach(b => b.onclick = () => { const a = Number(b.dataset.cerrar); $('#confirmar').innerHTML = `<div class="banner">¿Cerrar ${a}? Quedará en solo lectura de forma permanente. <button id="siCerrar">Sí, cerrar ${a}</button> <button class="ghost" id="noCerrar">Cancelar</button></div>`; $('#noCerrar').onclick = () => $('#confirmar').innerHTML = ''; $('#siCerrar').onclick = async () => { if (st.api) await fetch(`/api/anios/${a}/cerrar`, { method: 'POST' }); st.cerrados.push(a); guardar(); toast(`Año ${a} cerrado`); render(); }; });
  const ex = $('#exp'); if (ex) ex.onclick = async () => { const t = JSON.stringify({ anio: { anio: st.anio, cerrado: st.cerrados.includes(st.anio) ? 1 : 0 }, registros: regsActuales() }, null, 1); const ta = $('#expTxt'); ta.value = t; ta.hidden = false; try { await navigator.clipboard.writeText(t); toast('JSON copiado'); } catch (e) { ta.select(); toast('Seleccionado: copie con Ctrl+C'); } };
  const im = $('#imp'); if (im) im.onchange = () => { const f = im.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const j = JSON.parse(rd.result); const a = j.anio?.anio || st.anio; st.regs[a] = j.registros || []; if (!st.anios.includes(a)) st.anios.push(a); st.demo = false; guardar(); toast(`${st.regs[a].length} registros importados en ${a}`); render(); } catch (e) { toast('El archivo no es un JSON válido del sistema'); } }; rd.readAsText(f); };
  const fs = $('#fsug'); if (fs) fs.onsubmit = async e => { e.preventDefault(); const texto = $('#sug-txt').value.trim();
    if (st.api) { const r = await fetch('/api/sugerencias', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ texto, pantalla: st.tab }) }); const j = await r.json().catch(() => ({})); if (!r.ok) { toast(j.error || 'No se pudo enviar'); return; } }
    (st.sugerencias ||= []).push({ texto, fecha: new Date().toISOString() }); guardar(); toast(st.api ? 'Sugerencia enviada al equipo de mejora' : 'Sugerencia guardada en este navegador (se envía cuando la app esté en Cloudflare)'); render(); };
  document.querySelectorAll('[data-uedit]').forEach(b => b.onclick = () => { st.uEdit = JSON.parse(JSON.stringify(st.usuarios[+b.dataset.uedit])); render(); });
  const un = $('#u-nuevo'); if (un) un.onclick = () => { st.uEdit = null; render(); };
  const fu = $('#fusr'); if (fu) fu.onsubmit = async e => { e.preventDefault();
    const u = { email: $('#u-mail').value.trim().toLowerCase(), nombre: $('#u-nom').value.trim(), cargo: 'Docente', activo: +$('#u-act').value,
      asignaciones: [...document.querySelectorAll('#fusr input[type=checkbox]:checked')].map(c => ({ grado: c.dataset.g, area: c.dataset.a })) };
    if (st.api) { const r = await fetch('/api/usuarios', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(u) }); const j = await r.json().catch(() => ({})); if (!r.ok) { toast(j.error || 'No se pudo guardar'); return; } }
    const i = st.usuarios.findIndex(x => x.email === u.email); if (i >= 0) st.usuarios[i] = u; else st.usuarios.push(u);
    st.uEdit = null; guardar(); toast('Docente guardado'); render(); };
  const bd = $('#borrarDemo'); if (bd) bd.onclick = () => { st.regs = { 2027: [] }; st.anios = [2027]; st.cerrados = []; st.anio = 2027; st.demo = false; st.usuarios = []; st.yo = { rol: 'directivo', nombre: 'Vista previa', email: '' }; guardar(); toast('Datos de ejemplo borrados'); render(); };
}

(async function inicio() {
  st.api = await detectarApi();
  if (st.api) {
    st.demo = false;
    const ry = await fetch('/api/yo');
    if (!ry.ok) { const j = await ry.json().catch(() => ({})); st.sinAcceso = j.error || 'Su correo no está autorizado.'; render(); return; }
    st.yo = await ry.json();
    if (esDir()) { const ru = await fetch('/api/usuarios'); if (ru.ok) st.usuarios = (await ru.json()).usuarios; }
    const a = await (await fetch('/api/anios')).json();
    st.anios = a.map(x => x.anio); st.cerrados = a.filter(x => x.cerrado).map(x => x.anio);
    st.anio = st.anios.includes(new Date().getFullYear()) ? new Date().getFullYear() : st.anios.at(-1);
    await cargarAnio(st.anio);
    for (const y of st.anios) if (y !== st.anio) await cargarAnio(y);
  } else if (!cargarLocal()) {
    st.regs = { 2026: demo(2026, -0.06), 2027: demo(2027, 0) }; st.anios = [2026, 2027]; st.cerrados = [2026]; st.anio = 2027; st.demo = true;
  }
  if (!st.api) { if (!st.usuarios?.length) st.usuarios = usuariosDemo(); if (!st.yo) st.yo = { rol: 'directivo', nombre: 'Vista previa', email: '' }; }
  render();
})();
</script>

</body></html>
