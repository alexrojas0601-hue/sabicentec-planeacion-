# Sistema de Planeación CENTEC — Cloudflare Worker + static assets + D1
name = "sabicentec-planeacion"   # debe coincidir con el Worker creado en Cloudflare
main = "worker/src/index.js"

# Subdominio dentro del ecosistema SABI (la zona sabicentec.com ya está en esta cuenta de Cloudflare)
routes = [{ pattern = "planeacion.sabicentec.com", custom_domain = true }]
compatibility_date = "2026-01-01"

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/descargas/*"]

[[d1_databases]]
binding = "DB"
database_name = "centec-planeacion"
database_id = "03a8ddb5-9dc6-46a2-8e3e-6a6e966906d2"   # creada el 21-oct-2026
migrations_dir = "worker/migrations"

# Directorio central del ingreso único SABI (mismo que usa sabicentec.com)
[[d1_databases]]
binding = "USUARIOS"
database_name = "sabicentec-usuarios"
database_id = "8b98ac35-e353-4a59-a8ef-fa10ee4d606d"

# SECRETOS (Cloudflare → Workers → sabicentec-planeacion → Settings → Variables and secrets):
#   SSO_SECRET    → el MISMO valor que en sabicentec-portal (ingreso único SABI)
#   AGENTES_TOKEN → clave larga aleatoria; la usan los GitHub Actions (solo lectura)
# Las personas y sus permisos se gestionan en https://sabicentec.com/usuarios

# Automatización: todos los días 6:00 a. m. Colombia (11:00 UTC)
[triggers]
crons = ["0 11 * * *"]
# Otros secretos (wrangler secret put): ALERT_WEBHOOK (Google Chat / Slack / pasarela WhatsApp), GH_TOKEN, GH_REPO
